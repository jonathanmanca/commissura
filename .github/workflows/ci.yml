name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same branch: the
# older result is about code nobody will ship.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The declared floor is 3.11 and every version up to 3.14 is supported, so
    # all four are run. Until now the floor was guaranteed only by ruff's
    # target-version and mypy's python_version, which catch syntax and standard
    # library APIs but not behaviour.
    name: Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      # Do not stop the other versions when one fails: on a first run the
      # interesting question is which versions break, not that one did.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create the environment
        run: uv venv

      - name: Install the project and its dev extras
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # tests/test_shacl_conformance.py skips here by design. The HealthDCAT-AP
      # shapes live under reference/, which is gitignored, and fetching them
      # from code.europa.eu on every push would make this pipeline depend on a
      # server nobody here controls. Conformance is checked locally instead.
      - name: Test
        run: uv run pytest

  windows:
    # The project claims to be cross-platform and was developed only on Windows.
    # The Ubuntu job above is what makes that claim true; this one stops the
    # opposite regression, where a fix for Linux breaks the platform the author
    # actually works on. One version is enough for that.
    name: Python 3.14 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Create the environment
        run: uv venv

      - name: Install the project and its dev extras
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
