[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commissura"
version = "0.1.1"
description = "Turn raw clinical material into standardised, de-identified, research-ready datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jonathan Manca" }]
keywords = [
  "clinical-data",
  "de-identification",
  "pseudonymisation",
  "bids",
  "hl7",
  "dicom",
  "ehds",
  "synthetic-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  # The build backend, named again here so tests/test_packaging.py can build a
  # wheel and an sdist in process and look inside them. It is already required
  # to build this project at all, so this adds no third-party dependency -- it
  # moves one from build isolation into the test environment. Asserting on the
  # configuration instead would be asserting on the instruction rather than on
  # the artefact, and the artefact is what gets published.
  "hatchling>=1.27",
  # Read-only, and for one guard: tests/test_packaging.py asserts that no
  # workflow in this repository can publish to an index without a human
  # starting it. GitHub parses these files as YAML, so the semantics are what
  # matter -- a text search for "push:" would pass happily on
  # `on: [workflow_dispatch, push]`, and the act being guarded is the only
  # irreversible one this project has.
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
  # Dev only. Used by tests/test_shacl_conformance.py to judge the emitted
  # HealthDCAT-AP description against the profile's own SHACL shapes. Never a
  # runtime dependency: `pip install commissura` stays light.
  "pyshacl>=0.26",
]

[project.urls]
# PyPI renders these as the sidebar of a page strangers read, so each one has
# to resolve for them and not only for the author. They waited on the decision
# of 2026-11-25 to make the repository public; before it, every link but the
# last would have been dead for everybody who installs the package.
# `tests/test_packaging.py` pins the set, so adding one stays a deliberate
# edit.
Homepage = "https://github.com/jonathanmanca/commissura"
Repository = "https://github.com/jonathanmanca/commissura"
Issues = "https://github.com/jonathanmanca/commissura/issues"
Changelog = "https://github.com/jonathanmanca/commissura/blob/main/CHANGELOG.md"
Author = "https://www.linkedin.com/in/jonathan-manca/"

[project.scripts]
commissura = "commissura.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commissura"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage is enforced on every run rather than offered as an optional flag.
# There is no CI on this project yet, so a threshold that applies only when
# somebody remembers to pass --cov is not a threshold. Use --no-cov to skip it
# while iterating on a single test.
addopts = """
  -ra --strict-markers --strict-config
  --cov=commissura --cov-branch --cov-report=term-missing
"""

[tool.coverage.run]
branch = true
source = ["commissura"]
omit = [
  # Exercised by tests/test_cli.py through a subprocess, which coverage cannot
  # instrument from here. Listing it is honest; counting it as uncovered would
  # misreport, and chasing it would mean testing the shim instead of the CLI.
  "*/commissura/__main__.py",
]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = false
exclude_also = [
  # Lines that exist for the type checker or for defence in depth, and whose
  # absence of coverage says nothing about the behaviour of the package.
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # naming conventions
  "UP",   # pyupgrade: don't write code older than our floor
  "B",    # bugbear: likely bugs
  "A",    # shadowing builtins
  "C4",   # comprehension style
  "SIM",  # simplifications
  "PTH",  # prefer pathlib over os.path
  "RUF",  # ruff's own rules
  "D",    # docstrings: this project is meant to be read
]
ignore = [
  "D203",  # conflicts with D211 (both cannot hold)
  "D213",  # we use D212: summary on the first line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]  # test modules and functions document themselves by name

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
