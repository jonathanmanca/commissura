[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "commissura"
version = "0.1.0"
description = "Turn raw clinical material into standardised, de-identified, research-ready datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jonathan Manca" }]
keywords = [
  "clinical-data",
  "de-identification",
  "pseudonymisation",
  "bids",
  "hl7",
  "dicom",
  "ehds",
  "synthetic-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
commissura = "commissura.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/commissura"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Coverage is enforced on every run rather than offered as an optional flag.
# There is no CI on this project yet, so a threshold that applies only when
# somebody remembers to pass --cov is not a threshold. Use --no-cov to skip it
# while iterating on a single test.
addopts = """
  -ra --strict-markers --strict-config
  --cov=commissura --cov-branch --cov-report=term-missing
"""

[tool.coverage.run]
branch = true
source = ["commissura"]
omit = [
  # Exercised by tests/test_cli.py through a subprocess, which coverage cannot
  # instrument from here. Listing it is honest; counting it as uncovered would
  # misreport, and chasing it would mean testing the shim instead of the CLI.
  "*/commissura/__main__.py",
]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = false
exclude_also = [
  # Lines that exist for the type checker or for defence in depth, and whose
  # absence of coverage says nothing about the behaviour of the package.
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # naming conventions
  "UP",   # pyupgrade: don't write code older than our floor
  "B",    # bugbear: likely bugs
  "A",    # shadowing builtins
  "C4",   # comprehension style
  "SIM",  # simplifications
  "PTH",  # prefer pathlib over os.path
  "RUF",  # ruff's own rules
  "D",    # docstrings: this project is meant to be read
]
ignore = [
  "D203",  # conflicts with D211 (both cannot hold)
  "D213",  # we use D212: summary on the first line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]  # test modules and functions document themselves by name

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
